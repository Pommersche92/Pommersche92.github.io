<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  
  {% seo %}
  {% feed_meta %}
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="navbar glass">
    <div class="container">
      <div class="nav-brand">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      
      <ul class="nav-menu">
        <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a></li>
        <li><a href="{{ '/stories/' | relative_url }}" class="nav-link">Stories</a></li>
        <li><a href="{{ '/impressum/' | relative_url }}" class="nav-link">Privacy</a></li>
      </ul>
      
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="footer glass">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
      <p>
        <a href="{{ '/impressum/' | relative_url }}">Privacy</a> | 
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/gdpr.js' | relative_url }}"></script>
</body>
</html>
